name: "Push Binary Cache for Nix"
# Upstream's Cachix push. Needs the CACHIX_AUTH_TOKEN secret (absent on this
# fork) and the Nix installer can't set up networking on fork runners
# ("cannot set loopback interface flags"). Disabled (manual-only) so it stops
# failing on every push.
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: nixbuild/nix-quick-install-action@v19
        with:
          nix_conf: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v11
        with:
          name: xplr
          authtoken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix profile install .
      - name: Run tests
        run: |
          xplr --version
