name: Release

# Builds release binaries for Linux (x86_64, plus a Debian .deb) and macOS
# (Intel + Apple Silicon), and attaches them to a GitHub Release.
#
# - Push a tag like `v1.1.0`  -> builds + creates/updates the matching Release.
# - Run manually (workflow_dispatch) -> builds + uploads the binaries as
#   downloadable workflow artifacts (no Release is created).
#
# Lua is vendored (default feature `vendored-lua`), so no system Lua/OpenSSL is
# needed — only the Rust toolchain and the C compiler already on the runners.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            deb: true
          - name: macos-x86_64
            os: macos-14 # cross-compile from Apple Silicon; Intel runners are scarce/slow
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-14 # Apple Silicon
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package tarball
        shell: bash
        run: |
          bin=xplr
          name="xplr-${{ matrix.name }}"
          dir="target/${{ matrix.target }}/release"
          tar -C "$dir" -czf "$name.tar.gz" "$bin"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Build Debian package
        if: matrix.deb
        shell: bash
        run: |
          cargo install cargo-deb --locked
          cargo deb --target ${{ matrix.target }} --no-build
          deb=$(find "target/${{ matrix.target }}/debian" -name '*.deb' | head -1)
          cp "$deb" xplr-linux-x86_64.deb
          shasum -a 256 xplr-linux-x86_64.deb > xplr-linux-x86_64.deb.sha256

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xplr-${{ matrix.name }}
          path: |
            xplr-${{ matrix.name }}.tar.gz
            xplr-${{ matrix.name }}.tar.gz.sha256
            *.deb
            *.deb.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xplr-${{ matrix.name }}.tar.gz
            xplr-${{ matrix.name }}.tar.gz.sha256
            *.deb
            *.deb.sha256
